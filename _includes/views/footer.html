<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
      <!-- لینک‌های اجتماعی فقط با آیکون -->
      <div class="social-links">
        {% if site.github_username %}
          <a href="https://github.com/{{ site.github_username }}" target="_blank" title="GitHub" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
        {% endif %}
        
        {% if site.linkedin_username %}
          <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" title="LinkedIn" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
        {% endif %}
        
        {% if site.email %}
          <a href="mailto:{{ site.email }}" title="Email" aria-label="Email">
            <i class="fas fa-envelope"></i>
          </a>
        {% endif %}
        
        {% if site.phone %}
          <a href="tel:{{ site.phone }}" title="Phone" aria-label="Phone">
            <i class="fas fa-phone"></i>
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</footer>
